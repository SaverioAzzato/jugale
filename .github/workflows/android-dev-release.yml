name: Android Dev Draft

# A vX.Y.Z-dev.N tag pointing at the current `develop` head builds a release-signed APK for the
# separate `it.azzato.jugale.dev` application. The result is a draft/prerelease visible only to
# repository collaborators until it is explicitly published (normally it is downloaded, tested,
# then the draft is deleted). Stable desktop builds and Pages are intentionally handled elsewhere.
on:
  push:
    tags: ["v*-dev*"]

jobs:
  android-dev-draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.11902837"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify develop head and tag version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] \
            || { echo "::error::expected tag vX.Y.Z-dev.N, got $tag"; exit 1; }
          git fetch origin develop
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)" ] \
            || { echo "::error::$tag must point exactly at origin/develop HEAD"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$tag" ] \
            || { echo "::error::tag $tag does not match package version $version"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Repository preflight
        run: npm run check

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Initialize Android project
        # Init and build must see the same identifier; otherwise init scaffolds the stable Java
        # package while build looks for it.azzato.jugale.dev and fails before Gradle starts.
        run: npx tauri android init --ci --config src-tauri/tauri.dev.conf.json
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Brand the generated icons
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Configure release signing
        run: bash scripts/android-sign-setup.sh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build JUGALE Dev APK
        shell: bash
        run: |
          set -o pipefail
          if npx tauri android build --apk --ci --config src-tauri/tauri.dev.conf.json 2>&1 | tee android-build.log; then
            exit 0
          fi
          # Draft logs require an authenticated maintainer. Mirror the useful tail into one check
          # annotation so a failed device build remains diagnosable through the public Checks API.
          details=$(tail -n 80 android-build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android Dev APK build failed::$details"
          exit 1
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      - name: Verify release signature and Dev application ID
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android -name "*.apk" -path "*release*" -path "*universal*" | head -n1)
          [ -n "$apk" ] || apk=$(find src-tauri/gen/android -name "*.apk" -path "*release*" | head -n1)
          [ -n "$apk" ] || { echo "::error::no release APK found"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          [ -n "$aapt" ] || { echo "::error::aapt not found"; exit 1; }
          out=$("$apksigner" verify --verbose --print-certs "$apk")
          echo "$out"
          echo "$out" | grep -qi "CN=Android Debug" \
            && { echo "::error::Dev APK is debug-signed"; exit 1; }
          echo "$out" | grep -Eqi "v2 scheme.*: *true" \
            || { echo "::error::Dev APK has no v2 signature"; exit 1; }
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | head -n5
          echo "$badging" | grep -q "package: name='it.azzato.jugale.dev'" \
            || { echo "::error::APK does not use the Dev application ID"; exit 1; }
          echo "$badging" | grep -q "application-label:'JUGALE Dev'" \
            || { echo "::error::APK does not use the JUGALE Dev label"; exit 1; }

      - name: Create draft release and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          safe_tag="${tag//\//-}"
          apk=$(find src-tauri/gen/android -name "*.apk" -path "*release*" -path "*universal*" | head -n1)
          [ -n "$apk" ] || apk=$(find src-tauri/gen/android -name "*.apk" -path "*release*" | head -n1)
          [ -n "$apk" ] || { echo "::error::no release APK found"; exit 1; }
          gh release create "$tag" --draft --prerelease \
            --title "JUGALE Dev $tag" \
            --notes "Private Android test build from develop. Installs alongside stable JUGALE as JUGALE Dev. Do not publish." \
            -R "${{ github.repository }}"
          cp "$apk" "JUGALE-Dev-${safe_tag}-android.apk"
          gh release upload "$tag" "JUGALE-Dev-${safe_tag}-android.apk" \
            --clobber -R "${{ github.repository }}"
